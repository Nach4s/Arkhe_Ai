on:
  push:
    - workflows: deploy-workflow

tokens:
  SERVICE_CONNECTION:
    service_connection: default-service-connection
    scope: org

workflows:
  deploy-workflow:
    tasks:
      - name: deploy-task
        cubes:
          # Получаем IAM-токен для работы с Yandex Cloud
          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest
          
          # Настройка Yandex Cloud CLI и деплой
          - name: deploy-to-yc
            env:  
              YC_FOLDER_ID: ${{ tokens.SERVICE_CONNECTION.folder_id }}
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              # Добавьте переменные окружения для вашего бота
              # BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
            image: 
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                # Настройка YC CLI
                yc config set folder-id $YC_FOLDER_ID
                
                # Пример: деплой в Serverless Container
                # yc serverless container create --name arkhe-ai-bot --folder-id $YC_FOLDER_ID || true
                # yc serverless container revision deploy \
                #   --container-name arkhe-ai-bot \
                #   --image cr.yandex/YOUR_REGISTRY/arkhe-ai:latest \
                #   --service-account-id $YC_SA_ID \
                #   --environment BOT_TOKEN=$BOT_TOKEN,OPENAI_API_KEY=$OPENAI_API_KEY
                
                # Или деплой в Cloud Run
                # yc run service create --name arkhe-ai-bot --image cr.yandex/YOUR_REGISTRY/arkhe-ai:latest || true
                # yc run service deploy arkhe-ai-bot \
                #   --image cr.yandex/YOUR_REGISTRY/arkhe-ai:latest \
                #   --service-account-id $YC_SA_ID \
                #   --env BOT_TOKEN=$BOT_TOKEN,OPENAI_API_KEY=$OPENAI_API_KEY
                
                echo "IAM Token получен успешно"
                echo "Folder ID: $YC_FOLDER_ID"
                echo "Service Account ID: $YC_SA_ID"
                echo "Для полного деплоя раскомментируйте команды выше и настройте переменные окружения"

